name: Publish New Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.2.0)'
        required: true
        type: string

concurrency:
  group: publish-version-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted Publishing: the upload authenticates with this job's OIDC token, scoped by PyPI to this repo, this
    # workflow file and the `pypi` environment (owner is the required reviewer; self-review is off). No PyPI token exists.
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PDM
      run: |
        pip install --user pdm
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Build package
      run: |
        rm -rf dist/
        pdm build

    # Publish before tagging: if the upload fails, no tag or release is left
    # behind. Each step below is guarded so the whole workflow can be safely
    # re-run for the same version after a partial failure (e.g. "Re-run failed
    # jobs" once the tag was pushed but the release step errored).
    - name: Check the version input matches pyproject.toml
      run: |
        want="${{ github.event.inputs.version }}"
        have=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
        [ "$want" = "$have" ] || { echo "input version $want != pyproject.toml version $have"; exit 1; }

    - name: Publish to PyPI (Trusted Publishing)
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        skip-existing: true

    - name: Create Git tag
      run: |
        TAG="v${{ github.event.inputs.version }}"
        if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists on origin, skipping"
        else
          git tag "$TAG"
          git push origin "$TAG"
        fi

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="v${{ github.event.inputs.version }}"
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG already exists, skipping"
        else
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes "Release version ${{ github.event.inputs.version }}. Auto-generated release from GitHub Actions."
        fi
